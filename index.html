<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#02040a" />
  <title>Dr Darkstar — Pixel Rain</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Dr Darkstar pixel rain experiment"></canvas>
    <section class="hud" aria-live="polite">
      <div class="brand">DR DARKSTAR / PIXEL RAIN</div>
      <div id="status">loading collision mask…</div>
    </section>
    <section class="help">
      <span>WASD / arrows · move + animate</span>
      <span>M · show collision pixels</span>
      <span>R · reset rain</span>
      <span>P · pause</span>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
